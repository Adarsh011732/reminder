version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-deadline-radar:latest
    container_name: student_deadline_radar
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_PATH=/app/data/deadlines.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CORS_ORIGIN=*
    volumes:
      - radar_data:/app/data

volumes:
  radar_data:
    driver: local
